services:
  brain:
    build: .
    container_name: nexo-brain
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:4321:4321"
    env_file: .env
    volumes:
      - /opt/nexo-brain-data/learning:/app/learning
      - /opt/nexo-brain-data/memory:/app/memory
      # projetos registrados via API vivam no host: persistem rebuilds,
      # são versionados no git e aparecem no grafo sem rebuild de imagem
      - /opt/nexo-brain/projects:/app/projects
      # fichas de clientes alimentadas via POST /api/synapses/record: persistem
      # rebuilds e ficam versionadas no git (mesma ideia dos projects)
      - /opt/nexo-brain/clients:/app/clients
